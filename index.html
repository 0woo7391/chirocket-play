<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>치루켓</title>
  <style>
    /* Galmuri11 by Lee Minseo (quiple), SIL OFL 1.1 — public/fonts/Galmuri-OFL.md */
    @font-face { font-family: 'Galmuri11'; src: url('./fonts/Galmuri11.woff2') format('woff2'); font-display: swap; }
    html, body { margin: 0; height: 100%; background: #131A25; overflow: hidden; touch-action: none; overscroll-behavior: none; }
    /* Fixed 9:16 frame, centred with letterbox (design.md §2). */
    /* Largest 9:16 box that fits; dvh avoids mobile browser bars cropping the frame. */
    #game-frame { position: absolute; inset: 0; margin: auto; width: min(100vw, 100dvh * 9 / 16); height: min(100dvh, 100vw * 16 / 9); }
    /* Holding the canvas/pads is gameplay, not Safari text/image selection. */
    #game-frame, #game-frame * { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
    #game { width: 100%; height: 100%; display: block; image-rendering: pixelated; }
    .pad { position: absolute; bottom: 0; width: 50%; height: 40%; }
    #left { left: 0; } #right { right: 0; }
    #game-frame.menu .pad { pointer-events: none; } /* menus take taps on the canvas */
    #loading { position: absolute; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px; background: #131A25; color: #FAF0DB; text-align: center; font-family: sans-serif; padding: 24px; }
    #loading .loading-logo { width: min(80%, 320px); height: auto; }
    #loading p { margin: 0; font-size: 15px; line-height: 1.6; }
    .loading-mark { width: 6px; height: 6px; margin-right: 24px; background: #66D2BB; box-shadow: 12px 0 #66D2BB, 24px 0 #66D2BB; animation: loading-blink 0.8s steps(2) infinite; }
    @keyframes loading-blink { 50% { opacity: 0.25; } }
    .loading-bar { width: 60%; max-width: 220px; height: 8px; border: 2px solid #FAF0DB; padding: 1px; }
    .loading-bar i { display: block; height: 100%; width: 0; background: #66D2BB; transition: width 0.2s; }
    #loading[data-failed] .loading-bar, #loading[data-failed] .loading-mark { display: none; }
  </style>
  <script type="module" crossorigin src="./assets/index-UtTVbNAl.js"></script>
</head>
<body>
  <div id="game-frame">
    <canvas id="game" draggable="false"></canvas>
    <div class="pad" id="left" aria-label="왼쪽 분사 (A)"></div>
    <div class="pad" id="right" aria-label="오른쪽 분사 (D)"></div>
    <div id="loading" role="status" aria-live="polite">
      <img class="loading-logo" src="./logo.webp" alt="치루켓">
      <p>로딩 중… 0%</p>
      <div class="loading-bar" aria-hidden="true"><i></i></div>
      <span class="loading-mark" aria-hidden="true"></span>
    </div>
  </div>
  <script data-game-gestures>
    // Install before module/model loading. Gameplay uses Pointer Events, not emulated clicks.
    // This canvas-only surface reserves touches for play; future form controls need an exception.
    {
      const surface = document.querySelector('#game-frame');
      for (const type of ['touchstart', 'touchmove', 'touchend', 'gesturestart', 'gesturechange', 'gestureend', 'dblclick']) {
        surface.addEventListener(type, event => { if (event.cancelable) event.preventDefault(); }, { passive: false, capture: true });
      }
    }
  </script>
  <script data-loading-screen>
    // Works even if the game module itself cannot be downloaded or initialized.
    {
      const screen = document.querySelector('#loading');
      const fail = () => {
        if (!screen.isConnected) return;
        screen.dataset.failed = 'true';
        screen.setAttribute('role', 'alert');
        screen.querySelector('p').textContent = '불러오지 못했어요. 새로고침해 주세요.';
      };
      window.addEventListener('error', fail, true);
      window.addEventListener('unhandledrejection', fail);
    }
  </script>
</body>
</html>
